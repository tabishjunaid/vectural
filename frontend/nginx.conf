server {
    listen 80;
    server_name _;

    # Proxy API calls to the backend service (trailing slash strips the /api
    # prefix, so the backend sees /ask, /coverage, /review, …).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # A DEEP answer — especially on a gpt-5 reasoning model — can take a few
        # minutes, and /ask/stream sends no bytes between the "synthesize" stage
        # and the final "done" event. nginx's default 60s proxy_read_timeout would
        # cut the connection mid-synthesis and the browser would see a bogus
        # "network error". Give the model room, and stream SSE unbuffered so the
        # progress stages still flush to the client the instant they happen.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Fingerprinted build assets (index-<hash>.js, etc.) never change content for
    # a given name, so cache them hard — a new deploy ships new filenames.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html points at the hashed bundle, so it must always revalidate. Left
    # cacheable, the browser keeps loading an OLD bundle after every deploy —
    # stale UI until a manual hard refresh (exactly the section-cards regression).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Single-page app: serve static assets, fall back to index.html for routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
