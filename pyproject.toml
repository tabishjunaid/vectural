[project]
name = "vectural"
version = "0.1.0"
description = "Vectural — governed RAG source of truth over a multi-language microservices estate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Runtime dependencies. Kept deliberately lean for the Phase 1 deterministic
# ingestion slice: nothing here reaches an LLM gateway or an external datastore.
# Later phases (routing layer, Neo4j/OpenSearch clients, Temporal) add their own.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # One tree-sitter toolchain across every estate language (implementation-plan §3).
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
    # Phase 2 serving slice: FastAPI retrieval API (implementation-plan §3, §Phase 2).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# The OpenSearch-backed search/index path. Optional so the deterministic pipeline
# and the offline in-memory retrieval path install with zero infra dependencies.
opensearch = [
    "opensearch-py>=2.6",
]
# The Neo4j-backed graph store. Optional so the graph logic + structural queries
# run and test entirely in-memory with no database.
neo4j = [
    "neo4j>=5.24",
]
# The PostgreSQL system-of-record repositories.
postgres = [
    "psycopg[binary]>=3.2",
]
# Durable orchestration under a real Temporal server. Optional — the workflow
# logic is deterministic and tested with no Temporal running.
temporal = [
    "temporalio>=1.8",
]
# OpenTelemetry → SigNoz metrics export. Optional — the collector works standalone.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "httpx>=0.27",  # Starlette TestClient transport
]

[project.scripts]
vectural-ingest = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Optional infra clients (installed only via extras). Their absence must not
# fail the type check of the in-memory/offline code paths.
[[tool.mypy.overrides]]
module = ["neo4j.*", "opensearchpy.*", "temporalio.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient nudges toward httpx2; not actionable for us yet.
    "ignore:Using `httpx` with `starlette.testclient`",
]
