# Vectural local stack (design-document §6 as a runnable compose approximation).
#
#   docker compose up --build                                    # demo: sample-estate, in-memory
#   docker compose --profile datastores --profile indexing up -d --build   # full real stack
#
# Defaults give the self-contained demo (in-memory, fake gateway, hashing embedder).
# Override via a .env file (compose auto-loads it) to serve your real indexed estate:
#   VECTURAL_ESTATE_HOST_PATH=/abs/path/to/estate
#   VECTURAL_BACKING=real
#   VECTURAL_EMBEDDER=bge-m3          # real BGE-M3 (model cached in the hf-cache volume)
#   VECTURAL_GATEWAY=real             # + VECTURAL_GATEWAY_CLIENT=pkg.mod:Class (your own client, §2)
# See .env.example.

# Shared config for the backend API and the indexing worker — same image, one config.
x-vectural-env: &vectural-env
  VECTURAL_BACKING: ${VECTURAL_BACKING:-inmemory}
  VECTURAL_EMBEDDER: ${VECTURAL_EMBEDDER:-hashing}
  VECTURAL_GATEWAY: ${VECTURAL_GATEWAY:-fake}
  VECTURAL_GATEWAY_CLIENT: ${VECTURAL_GATEWAY_CLIENT:-}
  VECTURAL_ESTATE_ROOT: /estate
  VECTURAL_MANIFEST_PATH: /estate/manifest.yaml
  VECTURAL_POSTGRES_DSN: postgresql://vectural:vectural@postgres:5432/vectural
  VECTURAL_VALKEY_URL: redis://valkey:6379/0
  VECTURAL_OPENSEARCH_URL: http://opensearch:9200
  VECTURAL_NEO4J_URI: bolt://neo4j:7687
  VECTURAL_NEO4J_PASSWORD: vecturalpw
  VECTURAL_TEMPORAL_TARGET: temporal:7233

x-vectural-volumes: &vectural-volumes
  # The estate to serve/index (defaults to the bundled sample-estate); the model cache
  # so BGE-M3 downloads once and persists across restarts.
  - ${VECTURAL_ESTATE_HOST_PATH:-./sample-estate}:/estate:ro
  - hf-cache:/root/.cache/huggingface

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *vectural-env
    volumes: *vectural-volumes
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - valkey

  # Durable indexing worker (§5.7) — same image, hosts the Temporal workflow +
  # activities. Started with `--profile indexing`. Kick a run with:
  #   docker compose run --rm backend vectural-index --wait
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["vectural-indexer-worker"]
    profiles: ["indexing"]
    environment: *vectural-env
    volumes: *vectural-volumes
    depends_on:
      - postgres
      - temporal

  frontend:
    build:
      context: ./frontend
    ports:
      - "5175:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vectural
      POSTGRES_PASSWORD: vectural
      POSTGRES_DB: vectural
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectural"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  # Heavy datastores — started only with `--profile datastores`.
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    profiles: ["datastores"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data

  neo4j:
    image: neo4j:5-community
    profiles: ["datastores"]
    environment:
      NEO4J_AUTH: neo4j/vecturalpw
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  # Durable indexing orchestrator (§5.7) — started only with `--profile indexing`.
  # Its own Postgres so the estate's system-of-record DB stays independent of
  # Temporal's internal state.
  temporal-postgres:
    image: postgres:16-alpine
    profiles: ["indexing"]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporalpgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    profiles: ["indexing"]
    depends_on:
      - temporal-postgres
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233"  # gRPC — vectural-indexer-worker / vectural-index connect here

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["indexing"]
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"  # workflow history / continue-as-new / timers

volumes:
  pgdata:
  osdata:
  neo4jdata:
  temporalpgdata:
  hf-cache:      # HuggingFace model cache (BGE-M3) — downloaded once, reused
